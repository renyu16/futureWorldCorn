name: Test

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]

env:
  FOUNDRY_PROFILE: ci

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Forge build
        run: forge build --sizes

      - name: Forge tests
        run: forge test -vvv
