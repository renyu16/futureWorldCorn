[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"

remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "@chainlink/=lib/chainlink-brownie-contracts/contracts/",
]

[profile.test]
ffi = true

[profile.ci]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10000
